---

- name: Create project directory
  file:
    path: "{{ nginx_compose_project_dir }}"
    state: directory
    mode: '0755'

- name: Generate docker-compose.yml from template
  template:
    src: templates/docker-compose.yml.j2
    dest: "{{ project_dir }}/{{ nginx_exporter_container_name }}-compose.yml"
    mode: '0644'

- name: Start docker nginx exporter container
  community.docker.docker_compose:
    project_src: "{{ project_dir }}/{{ nginx_exporter_container_name }}-compose.yml"
    state: present
    recreate: always
    remove_orphans: yes

- name: Verify containers are running
  command: docker compose ps
  register: compose_ps
  changed_when: false
  args:
    chdir: "{{ project_dir }}"

- name: Display container status
  debug:
    var: compose_ps.stdout_lines
